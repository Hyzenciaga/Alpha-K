name: Release macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: |
          pnpm lint
          pnpm test
          pnpm build

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Build and sign update manifest
        env:
          ALPHA_K_UPDATE_PRIVATE_KEY_BASE64: ${{ secrets.ALPHA_K_UPDATE_PRIVATE_KEY_BASE64 }}
        run: |
          test -n "$ALPHA_K_UPDATE_PRIVATE_KEY_BASE64"
          pnpm exec electron-builder --mac --arm64 --publish never
          pnpm update:manifest -- \
            --asset "release/Alpha-K-$(node -p "require('./package.json').version")-arm64.zip" \
            --version "$(node -p "require('./package.json').version")" \
            --output release/latest.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/Alpha-K-*.dmg \
            release/Alpha-K-*.zip \
            release/latest.json \
            --title "Alpha-K $GITHUB_REF_NAME" \
            --generate-notes
